plugins {
    id 'com.android.application'
}
android {
    namespace 'id.kimiaku.app'
    compileSdk 34
    defaultConfig {
        applicationId 'id.kimiaku.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
