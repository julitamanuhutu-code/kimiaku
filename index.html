<!DOCTYPE html>
<html lang="id">
<head>

<title>KIMIAKU – Smart Chemistry Learning Platform</title>
<style>
:root{--navy:#0A2F4A;--sea:#1B6CA0;--teal:#0E7C7B;--foam:#F2F9F9;--sand:#F6EEDD;--coral:#E8604C;--ink:#1F3B4D;--mut:#4A6475;--line:#D3E7EC}
*{box-sizing:border-box}
body{margin:0;background:var(--foam);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{display:flex;flex-direction:column;min-height:100vh}
main{flex:1;width:100%;max-width:820px;margin:0 auto;padding:0 0 84px}
nav.bar{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);z-index:5}
nav.bar button{flex:1;min-height:60px;border:0;border-top:3px solid transparent;background:#fff;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700}
nav.bar button.on{color:var(--navy);border-top-color:var(--sea)}
@media(min-width:900px){.wrap{flex-direction:row}nav.bar{position:sticky;top:0;height:100vh;width:220px;flex-direction:column;justify-content:flex-start;background:var(--navy);border:0;padding:20px 12px;gap:6px;flex:0 0 220px}nav.bar .logo{display:block}nav.bar button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;min-height:48px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:#CFE9EE;font-size:15px}nav.bar button.on{background:var(--sea);color:#fff}main{padding-bottom:40px}}
nav.bar .logo{display:none;color:#fff;font-weight:800;font-size:22px;letter-spacing:1px;padding:0 12px 16px}
.hd{background:var(--navy);color:#fff;padding:24px 20px 6px}
.hd h1,.hd h2{margin:0}
.wave{display:block;width:100%;height:36px;background:var(--navy)}
.pad{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
h2{font-size:24px;font-weight:800;margin:0}h3{font-size:17px;margin:0;font-weight:800}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.sand{background:var(--sand);border-radius:16px;padding:16px}
.btn{min-height:48px;padding:0 22px;border:0;border-radius:12px;background:var(--sea);color:#fff;font-weight:800;font-size:16px}
.btn.alt{background:#fff;color:var(--sea);border:1px solid var(--sea)}
.btn.teal{background:var(--teal)}.btn.danger{background:#fff;color:#B03A28;border:1px solid var(--coral)}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{min-height:36px;display:inline-flex;align-items:center;padding:0 14px;border-radius:18px;font-size:13px;font-weight:700}
.pill.on{background:#D9F2EA;color:#0A5C5B}.pill.off{background:var(--sand);color:#7A4B00}
.bar2{height:10px;background:#DCEBEF;border-radius:5px;overflow:hidden}.bar2>i{display:block;height:100%;background:var(--sea)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:22px;color:var(--navy)}.stat span{font-size:12px;color:var(--mut)}
.lnk{text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.tag{font-size:13px;font-weight:700;color:var(--teal)}
.back{align-self:flex-start;min-height:44px;padding:0 10px;border:0;background:transparent;color:var(--sea);font-weight:700;font-size:15px}
.txt p{margin:0 0 10px}
input[type=text],input[type=password],textarea,select{width:100%;border:1px solid #9CC3D0;border-radius:10px;padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;font-weight:700;color:var(--mut);display:block;margin-bottom:4px}
.opt{text-align:left;min-height:52px;padding:8px 16px;border-radius:12px;border:2px solid #C5DCE6;background:#fff;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.opt.ok{background:#D9F2EA;border-color:var(--teal)}.opt.no{background:#FCE4E0;border-color:var(--coral)}
.steps{display:flex;gap:4px}.steps i{flex:1;height:6px;border-radius:3px;background:#DCEBEF}.steps i.v{background:var(--sea)}.steps i.c{background:var(--navy)}
.ptab{overflow-x:auto;padding-bottom:6px}.pt{display:grid;grid-template-columns:repeat(18,34px);grid-auto-rows:42px;gap:3px;min-width:640px}
.el{border:1px solid #9CC3D0;border-radius:6px;background:#fff;font-size:12px;font-weight:700;padding:0;color:var(--ink);line-height:1.1}
.el small{display:block;font-size:9px;font-weight:400}.el.g1{background:#CDEDEA}.el.g2{background:#D6E6F5}.el.g17{background:#FAD9D2}.el.g18{background:#EFE4C8}.el.sea{box-shadow:0 0 0 2px var(--navy)}.el.sel{outline:3px solid var(--coral)}
.nuc{display:inline-flex;flex-direction:column;font-size:.62em;line-height:1;vertical-align:middle;margin-right:2px;font-weight:700}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t td{padding:6px 4px;border-bottom:1px solid var(--line)}
.modalbg{position:fixed;inset:0;background:rgba(10,47,74,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:#fff;border-radius:16px;padding:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;z-index:30;font-size:14px;max-width:90vw}
.warn{background:var(--sand);border-left:4px solid var(--coral);padding:10px 12px;border-radius:8px;font-size:13px}
.fbtn{display:inline-flex;align-items:center;justify-content:center;margin:0;min-height:44px;padding:0 14px;border:1px solid var(--sea);border-radius:12px;background:#fff;color:var(--sea);font-size:14px;font-weight:800;cursor:pointer}.tb button{min-width:44px}.fig{margin:0;display:flex;flex-direction:column;gap:6px}.fig img,.fig video{max-width:100%;border-radius:12px;background:#000}.fig figcaption{font-size:13px;color:var(--mut)}
.badge{text-align:center;font-size:12px;font-weight:700}.badge.lock{opacity:.4}
</style>
</head>

<script type="application/json" id="seed">{"materi": [{"id": "struktur-atom", "versi": 1, "judul": "Struktur Atom", "jenjang": "SMA", "konteks": "Garam dari air laut Maluku", "viz": "atom", "tujuan": "Setelah belajar, kamu dapat:\n1. Menyebutkan partikel penyusun atom dan muatannya.\n2. Menentukan jumlah proton, neutron, dan elektron dari nomor atom dan nomor massa.\n3. Menjelaskan terbentuknya ion Na⁺ dan Cl⁻ dari konfigurasi elektronnya.", "fenomena": "Di pesisir Maluku, air laut dialirkan ke tambak lalu dijemur. Air menguap dan tersisa kristal garam putih. Air laut juga terasa asin dan dapat menghantarkan listrik, sedangkan kristal garam padat tidak.\nPertanyaan: partikel apa yang menyusun garam, dan dari mana asalnya?", "konsep": "Atom terdiri atas inti dan elektron.\n• Inti berisi proton (muatan +) dan neutron (tidak bermuatan).\n• Elektron (muatan −) berada di sekitar inti, pada kulit-kulit.\n• Nomor atom (Z) = jumlah proton. Pada atom netral, jumlah elektron = jumlah proton.\n• Nomor massa (A) = proton + neutron, sehingga neutron = A − Z.\n• Ion terbentuk ketika atom melepas atau menerima elektron. Jumlah proton tidak berubah.\n• Untuk unsur nomor atom 1–20, kulit pertama maksimal 2 elektron, kulit kedua 8, dan kulit ketiga 8.", "makro": "Yang dapat diamati dari garam dapur: kristal putih berbentuk kubus kecil, larut dalam air, dan terasa asin. Larutannya (seperti air laut) dapat menghantarkan listrik, sedangkan kristal padatnya tidak.", "submikro": "Kristal garam tersusun dari ion Na⁺ dan Cl⁻ yang tersusun teratur. Atom natrium (2, 8, 1) melepas 1 elektron menjadi Na⁺ (2, 8). Atom klor (2, 8, 7) menerima 1 elektron menjadi Cl⁻ (2, 8, 8). Ion berlawanan muatan saling tarik-menarik.\nDi dalam air, ion-ion itu bergerak bebas sehingga larutan menghantarkan listrik.\nCoba model di bawah: ubah jumlah elektron dan lihat muatannya.\nCatatan: model kulit ini disederhanakan. Elektron sebenarnya tidak mengorbit seperti planet, melainkan berada dalam orbital (awan elektron).", "simbolik": "Notasi atom: ²³₁₁Na berarti A = 23 dan Z = 11.\nProton = 11, elektron = 11, neutron = 23 − 11 = 12.\nPembentukan ion natrium: Na → Na⁺ + e⁻ (Na⁺: 11 proton, 10 elektron).\nPembentukan ion klorida: Cl + e⁻ → Cl⁻ (Cl: Z = 17, A = 35, neutron = 18; Cl⁻: 17 proton, 18 elektron).", "penerapan": "• Penggaraman ikan: garam digunakan untuk menghambat pertumbuhan mikroba pada ikan.\n• Korosi pada kapal: ion-ion terlarut dalam air laut membuat larutan menghantarkan listrik lebih baik, sehingga besi lebih cepat berkarat dibandingkan di air tawar.", "aktivitas": "Gunakan model atom pada bagian Submikroskopik:\n1. Pilih Na. Catat jumlah proton, neutron, dan elektron.\n2. Kurangi 1 elektron. Berapa muatannya? Bagaimana konfigurasinya?\n3. Pilih Cl, tambahkan 1 elektron, lalu bandingkan dengan Na⁺.\nBuka kembali Submikroskopik untuk mencoba.", "refleksi": "Dengan kata-katamu sendiri, jelaskan perbedaan atom Na dan ion Na⁺. Bagian mana yang masih membingungkan?", "soal": [{"id": "a1", "tipe": "pg", "teks": "Garam dapur tersusun dari ion Na⁺ dan Cl⁻. Nomor atom Na adalah 11. Berapa jumlah elektron atom Na yang netral?", "opsi": ["9 elektron", "10 elektron", "11 elektron", "12 elektron"], "kunci": 2, "bahas": "Pada atom netral, jumlah elektron sama dengan jumlah proton, yaitu sama dengan nomor atom: 11. Ion Na⁺ justru memiliki 10 elektron."}, {"id": "a2", "tipe": "pg", "teks": "Atom klor memiliki nomor atom 17 dan nomor massa 35. Berapa jumlah neutronnya?", "opsi": ["17", "18", "35", "52"], "kunci": 1, "bahas": "Neutron = nomor massa − nomor atom = 35 − 17 = 18."}, {"id": "a3", "tipe": "bs", "teks": "Ion Na⁺ memiliki 10 elektron.", "opsi": [], "kunci": true, "bahas": "Benar. Atom Na (11 elektron) melepas 1 elektron sehingga tersisa 10 elektron, sedangkan protonnya tetap 11."}, {"id": "a4", "tipe": "bs", "teks": "Neutron bermuatan negatif.", "opsi": [], "kunci": false, "bahas": "Salah. Neutron tidak bermuatan. Elektron yang bermuatan negatif, dan proton bermuatan positif."}, {"id": "a5", "tipe": "isian", "teks": "Ion yang terbentuk ketika atom klor menerima satu elektron ditulis: ... (contoh penulisan: Na+)", "opsi": [], "kunci": "Cl-", "bahas": "Atom klor menerima 1 elektron sehingga bermuatan −1: Cl⁻ (ion klorida). Kamu boleh menulisnya Cl- di keyboard."}, {"id": "a6", "tipe": "pg", "teks": "Air laut menghantarkan listrik, tetapi kristal garam padat tidak. Penjelasan submikroskopik yang paling tepat adalah ...", "opsi": ["Dalam air laut terdapat atom Na dan Cl netral yang bebas bergerak.", "Dalam air laut ion Na⁺ dan Cl⁻ bebas bergerak, sedangkan dalam kristal ion-ion terikat pada posisinya.", "Air laut mengandung elektron bebas dari atom natrium.", "Kristal garam tidak mengandung partikel bermuatan."], "kunci": 1, "bahas": "Kristal tersusun dari ion bermuatan, tetapi posisinya tetap sehingga tidak dapat mengalirkan muatan. Dalam larutan, ion bergerak bebas dan membawa muatan."}]}, {"id": "sistem-periodik", "versi": 1, "judul": "Sistem Periodik Unsur", "jenjang": "SMA", "konteks": "Unsur-unsur dalam air laut", "viz": "tabel", "tujuan": "Setelah belajar, kamu dapat:\n1. Menentukan golongan dan periode unsur nomor atom 1–20 dari konfigurasi elektronnya.\n2. Menjelaskan mengapa unsur segolongan memiliki sifat mirip.\n3. Menghubungkan ion-ion dalam air laut dengan letak unsurnya pada tabel periodik.", "fenomena": "Air laut mengandung natrium, klor, magnesium, kalsium, dan kalium. Natrium dan kalium sama-sama bereaksi hebat dengan air. Mengapa unsur-unsur berbeda dapat berperilaku mirip?", "konsep": "• Tabel periodik menyusun unsur menurut nomor atom.\n• Periode (baris) menunjukkan jumlah kulit yang terisi elektron.\n• Golongan (kolom) mengelompokkan unsur dengan jumlah elektron valensi yang sama (untuk golongan utama).\n• Elektron valensi adalah elektron pada kulit terluar. Golongan 1 punya 1, golongan 2 punya 2, dan golongan 13–18 punya (nomor golongan − 10).\n• Unsur segolongan memiliki sifat kimia yang mirip.", "makro": "Logam alkali (Li, Na, K) lunak dan mengilap, serta bereaksi dengan air menghasilkan gas hidrogen dan larutan basa. Reaksi ini berbahaya dan hanya boleh dilakukan guru atau laboran. Gas mulia (He, Ne, Ar) sangat sukar bereaksi.", "submikro": "Na (2, 8, 1) dan K (2, 8, 8, 1) sama-sama memiliki 1 elektron valensi yang mudah lepas. Elektron valensi K berada di kulit keempat, lebih jauh dari inti dibanding Na (kulit ketiga), sehingga lebih mudah dilepas. Klor (2, 8, 7) cenderung menerima 1 elektron.", "simbolik": "Na: konfigurasi 2, 8, 1 → periode 3, golongan 1.\nCl: konfigurasi 2, 8, 7 → periode 3, golongan 17 (valensi 7).\nCa: konfigurasi 2, 8, 8, 2 → periode 4, golongan 2.\nIon dalam air laut: Na⁺, K⁺, Mg²⁺, Ca²⁺, Cl⁻.", "penerapan": "Terumbu karang dan batu kapur tersusun terutama dari kalsium karbonat (CaCO₃). Kalsium (golongan 2) membentuk ion Ca²⁺, yang juga terdapat dalam air laut.", "aktivitas": "Gunakan tabel di bawah:\n1. Klik Na, K, dan Li. Apa kesamaan elektron valensinya?\n2. Klik Mg dan Ca. Di golongan berapa keduanya?\n3. Temukan lima unsur yang ditandai sebagai ion air laut.", "refleksi": "Mengapa unsur segolongan memiliki sifat yang mirip? Jelaskan dengan konsep elektron valensi.", "soal": [{"id": "p1", "tipe": "pg", "teks": "Unsur dengan konfigurasi elektron 2, 8, 2 terletak pada ...", "opsi": ["periode 2, golongan 3", "periode 3, golongan 2", "periode 2, golongan 2", "periode 3, golongan 3"], "kunci": 1, "bahas": "Tiga kulit terisi berarti periode 3. Dua elektron valensi berarti golongan 2 (unsur ini magnesium)."}, {"id": "p2", "tipe": "pg", "teks": "Atom klor memiliki konfigurasi elektron 2, 8, 7. Jumlah elektron valensinya adalah ...", "opsi": ["3", "5", "7", "17"], "kunci": 2, "bahas": "Elektron valensi adalah elektron pada kulit terluar, yaitu 7."}, {"id": "p3", "tipe": "bs", "teks": "Natrium dan kalium berada dalam satu golongan sehingga sifat kimianya mirip.", "opsi": [], "kunci": true, "bahas": "Benar. Keduanya golongan 1 dengan satu elektron valensi."}, {"id": "p4", "tipe": "isian", "teks": "Kalsium (nomor atom 20) berada pada golongan nomor ...", "opsi": [], "kunci": "2", "bahas": "Konfigurasinya 2, 8, 8, 2 sehingga memiliki 2 elektron valensi: golongan 2."}, {"id": "p5", "tipe": "pg", "teks": "Kalium bereaksi lebih hebat dengan air dibanding natrium. Penjelasan yang paling tepat adalah ...", "opsi": ["Kalium punya lebih banyak elektron valensi.", "Elektron valensi kalium berada lebih jauh dari inti sehingga lebih mudah dilepas.", "Kalium berada di periode yang lebih kecil.", "Kalium memiliki massa atom lebih kecil."], "kunci": 1, "bahas": "Keduanya punya 1 elektron valensi, tetapi pada kalium elektron itu di kulit keempat, lebih jauh dari inti dan lebih mudah lepas."}]}]}</script>

  +'<div class="card" style="display:flex;flex-direction:column;gap:10px"><b>Cadangan progres</b><span style="font-size:13px;color:var(--mut)">Data tersimpan di peramban perangkat ini. Cadangkan secara berkala agar tidak hilang.</span><div class="row"><button class="btn alt" data-act="expprog">Cadangkan progres</button><button class="btn alt" data-act="imp">Pulihkan / impor</button></div></div>'
  +'<button class="btn danger" data-act="reset">Hapus semua data di perangkat ini</button></div>';
  return h}
function vModal(){
  if(!modal)return '';var b='';
  if(modal.t==='confirm')b='<h3>'+esc(modal.msg)+'</h3><div class="row"><button class="btn danger" data-act="mok">Ya, lanjutkan</button><button class="btn alt" data-act="mno">Batal</button></div>';
  else if(modal.t==='imp')b='<h3>Impor paket atau cadangan</h3><div><label for="fil">Pilih berkas .json</label><input id="fil" type="file" accept=".json,application/json"></div><div><label for="pas">atau tempel isi berkas</label><textarea id="pas"></textarea></div>'+(modal.msg?'<div class="warn">'+esc(modal.msg)+'</div>':'')+'<div class="row"><button class="btn" data-act="doimp">Impor</button><button class="btn alt" data-act="mno">Tutup</button></div>';
  else if(modal.t==='pre'){b='<h3>Pratinjau: '+esc(E.judul||'(tanpa judul)')+'</h3>'+FIELDS.map(function(f){return '<div><div class="tag">'+f[1]+'</div><div class="txt">'+para(E[f[0]]||'(kosong)')+'</div>'+mediaHtml(E,f[0])+'</div>'}).join('')+'<button class="btn alt" data-act="mno">Tutup</button>'}
  else if(modal.t==='teks')b='<h3>Salin teks ini</h3><p style="margin:0;font-size:13px">Penyimpanan berkas langsung tidak tersedia. Salin isinya lalu simpan sebagai <b>'+esc(modal.name)+'</b>.</p><textarea id="cp" readonly style="min-height:160px">'+esc(modal.data)+'</textarea><div class="row"><button class="btn" data-act="copy">Salin</button><button class="btn alt" data-act="mno">Tutup</button></div>';
  return '<div class="modalbg" role="dialog" aria-modal="true"><div class="modal">'+b+'</div></div>'}
function render(){
  var a=$('#app'),n=V.name,fl=document.activeElement&&document.activeElement.id;
  ensureWeek();setTimeout(evalAll,0);
  if(n==='splash'){a.innerHTML=vSplash()+vModal();return}
  if(n==='welcome'){a.innerHTML='<div class="wrap"><main>'+vWelcome()+'</main></div>'+vModal();return}
  var views={beranda:vBeranda,belajar:vBelajar,materi:vMateri,latihan:vLatihan,quiz:vQuiz,hasil:vHasil,progres:vProgres,tantangan:vTantangan,lainnya:vLainnya,pengelola:vPengelola,editor:vEditor,pengaturan:vPengaturan,tentang:vTentang};
  var act=activeNav(),nav='<nav class="bar"><div class="logo">KIMIAKU</div>'+Object.keys(NAVL).map(function(k){return '<button class="'+(act===k?'on':'')+'" data-act="go" data-v="'+k+'" aria-label="'+NAVL[k]+'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+ICON[k]+'"/></svg>'+NAVL[k]+'</button>'}).join('')+'</nav>';
  a.innerHTML='<div class="wrap">'+nav+'<main>'+(views[n]||vBeranda)()+'</main></div>'+vModal()+(toastMsg?'<div class="toast" role="status">'+esc(toastMsg)+'</div>':'');
  if(fl&&$('#'+fl)&&/^(zr|isi|refl)$/.test(fl)){try{$('#'+fl).focus()}catch(e){}}
}
function vizUpdate(){var m=getM(V.m);if(!m)return;if(m.viz==='atom'){var vb=$('#vizbody');if(!vb)return;vb.innerHTML=atomBody();var z=$('#zr');if(z)z.value=AV.z;var l=$('#zl');if(l)l.textContent=ELS[AV.z-1][0]+' · '+ELS[AV.z-1][2]}else{var v=$('#viz');if(v)v.innerHTML=tableViz()}}

/* ---------- aksi ---------- */
function go(n,x){V=Object.assign({name:n},x||{});if(n!=='pengelola'&&n!=='editor')pinOK=pinOK;render();window.scrollTo(0,0)}
function judge(s,val){if(s.tipe==='pg'||s.tipe==='bs')return val===s.kunci;var n=function(x){return String(x).toLowerCase().replace(/[−–⁻]/g,'-').replace(/⁺/g,'+').replace(/\s+/g,'')};return String(s.kunci).split('|').some(function(k){return n(k)===n(val)})}
function answer(val){var m=getM(Q.mid),s=m.soal[Q.i];Q.sel=val;Q.ok=judge(s,val);Q.fb=true;Q.res[Q.i]=Q.ok;var key=m.id+':'+s.id;ensureWeek();if(Q.ok){S.mg.benar++;if(!S.benar[key]){S.benar[key]=1;award(10)}}mark();render()}
function finishQuiz(){var m=getM(Q.mid),ok=Q.res.filter(Boolean).length,sk=Math.round(ok/m.soal.length*100),p=prog(m.id);if(p.best==null||sk>p.best)p.best=sk;ensureWeek();if(sk>=80)S.mg.k80++;if(sk===100&&!p.perfect){p.perfect=1;award(20)}visit(m.id,8);S.hist.push({m:m.id,skor:sk,t:Date.now()});if(S.hist.length>200)S.hist.shift();persist();evalBadges();go('hasil')}
function download(m){return JSON.stringify({kimiaku:'paket',versi:2,materi:m,files:filesFor(m)})}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]');if(!t)return;var a=t.dataset.act,d=t.dataset;
  switch(a){
  case 'start':go(S.profil.nama?'beranda':'welcome');break;
  case 'mulai':var nm=$('#nm').value.trim();if(!nm){toast('Tulis nama panggilanmu dulu');break}S.profil.nama=nm.slice(0,40);S.profil.jenjang=$('#jj').value;persist();go('beranda');break;
  case 'go':go(d.v);break;
  case 'jenjang':V.jenjang=d.j;render();break;
  case 'buka':V={name:'materi',m:d.m,step:0};render();window.scrollTo(0,0);break;
  case 'step':V.step=Math.max(0,Math.min(STEPS.length-1,+d.i));render();window.scrollTo(0,0);evalBadges();break;
  case 'selesai':var p=prog(d.m);p.refl=$('#refl').value.slice(0,2000);visit(d.m,9);if(p.refl.trim()){ensureWeek();S.mg.rf[d.m]=1}if(Object.keys(p.v).length===STEPS.length&&!p.done){p.done=1;award(50);toast('Materi selesai! +50 poin')}persist();evalBadges();go('belajar');break;
  case 'az':AV.z=+d.z;AV.e=AV.z;vizUpdate();break;
  case 'ae':AV.e=Math.max(0,Math.min(20,AV.e+(+d.d)));vizUpdate();break;
  case 'pz':PT.z=+d.z;vizUpdate();break;
  case 'qstart':var mm=getM(d.m);if(!mm||!mm.soal.length){toast('Materi ini belum punya soal');break}Q={mid:d.m,i:0,sel:null,fb:false,ok:false,res:[]};go('quiz');break;
  case 'qpick':answer(d.k==='true'?true:d.k==='false'?false:+d.k);break;
  case 'qisi':var v=$('#isi').value.trim();if(!v){toast('Tulis jawabanmu dulu');break}answer(v);break;
  case 'qnext':if(Q.i+1<getM(Q.mid).soal.length){Q.i++;Q.sel=null;Q.fb=false;render();window.scrollTo(0,0)}else finishQuiz();break;
  case 'pin':var pv=$('#pin').value;if(!/^\d{4}$/.test(pv)){toast('PIN harus 4 angka');break}if(!S.pin){S.pin=pv;persist();pinOK=true;render()}else if(S.pin===pv){pinOK=true;render()}else toast('PIN salah');break;
  case 'fmt':var ta=$('#f-'+d.f);if(!ta)break;var s0=ta.selectionStart,s1=ta.selectionEnd,sel=ta.value.slice(s0,s1),w2={b:['**','**'],i:['*','*'],sub:['_{','}'],sup:['^{','}']}[d.k],ins=w2?w2[0]+(sel||'teks')+w2[1]:d.s;ta.setRangeText(ins,s0,s1,'end');E[d.f]=ta.value;ta.focus();break;
  case 'addurl':var ui=document.querySelector('[data-urlf="'+d.f+'"]'),uv=ui&&ui.value.trim();if(!uv||!/^https:\/\/\S+$/.test(uv)){toast('Tautan harus diawali https://');break}E.media=E.media||{};(E.media[d.f]=E.media[d.f]||[]);if(E.media[d.f].length>=8){toast('Maksimal 8 media per bagian');break}E.media[d.f].push({id:uid(),t:'url',cap:'',src:uv.slice(0,500)});render();break;
  case 'mup':case 'mdn':var Ls=E.media[d.f],ii=+d.i,jj=a==='mup'?ii-1:ii+1;if(jj>=0&&jj<Ls.length){var tmp=Ls[ii];Ls[ii]=Ls[jj];Ls[jj]=tmp;render()}break;
  case 'mdel':E.media[d.f].splice(+d.i,1);render();break;
  case 'pre':modal={t:'pre'};render();break;
  case 'new':E=normMateri({id:uid(),judul:'',soal:[]});E._baru=1;go('editor');break;
  case 'ed':E=clone(getM(d.m));go('editor');break;
  case 'dup':var c=clone(getM(d.m));c.id=uid();c.judul=c.judul+' (salinan)';S.materi.push(c);persist();toast('Materi diduplikasi');render();break;
  case 'del':modal={t:'confirm',msg:'Hapus materi ini dari perangkat?',ok:function(){S.materi=S.materi.filter(function(x){return x.id!==d.m});delete S.progres[d.m];if(S.last===d.m)S.last=null;persist();gcMedia();toast('Materi dihapus')}};render();break;
  case 'addsoal':E.soal.push({id:uid(),tipe:'pg',teks:'',opsi:['','','',''],kunci:0,bahas:''});render();break;
  case 'delsoal':E.soal.splice(+d.k,1);render();break;
  case 'saveed':if(!E.judul.trim()){toast('Judul materi wajib diisi');break}var n2=normMateri(E),ix=S.materi.findIndex(function(x){return x.id===n2.id});n2.versi=(ix>=0?(S.materi[ix].versi||1)+1:1);if(ix>=0)S.materi[ix]=n2;else S.materi.push(n2);persist();gcMedia();toast('Materi disimpan');go('pengelola');break;
  case 'exp':var mx=getM(d.m);saveFile('kimiaku-'+mx.id.replace(/[^a-z0-9-]/gi,'')+'.json',download([mx]));break;
  case 'expall':saveFile('kimiaku-paket-semua.json',download(S.materi));break;
  case 'imp':modal={t:'imp',msg:''};render();break;
  case 'doimp':var fi=$('#fil').files[0],pa=$('#pas').value.trim();if(fi){var r=new FileReader();r.onload=function(){var msg=importData(String(r.result));modal={t:'imp',msg:msg};render()};r.readAsText(fi)}else if(pa){modal={t:'imp',msg:importData(pa)};render()}else{modal.msg='Pilih berkas atau tempel isinya dulu.';render()}break;
  case 'expprog':saveFile('kimiaku-progres-'+today()+'.json',JSON.stringify({kimiaku:'progres',versi:1,data:{profil:S.profil,progres:S.progres,benar:S.benar,hist:S.hist,poin:S.poin,badges:S.badges,hari:S.hari}}));break;
  case 'offline':saveFile('KIMIAKU-offline.html',offlineHtml());break;
  case 'saveprof':S.profil.nama=$('#pn').value.trim().slice(0,40);S.profil.jenjang=$('#pj').value;persist();toast('Profil disimpan');break;
  case 'reset':modal={t:'confirm',msg:'Hapus semua data (progres dan perubahan materi) di perangkat ini?',ok:function(){S=fresh();persist();pinOK=false;V={name:'splash'};toast('Data direset')}};render();break;
  case 'mok':var f=modal.ok;modal=null;f();render();break;
  case 'mno':modal=null;render();break;
  case 'copy':var ta=$('#cp');ta.select();try{navigator.clipboard.writeText(ta.value).then(function(){toast('Tersalin')},function(){toast('Tekan Ctrl+C untuk menyalin')})}catch(e){toast('Tekan Ctrl+C untuk menyalin')}break;
  }});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='zr'){AV.z=+t.value;AV.e=AV.z;vizUpdate();return}
  if(t.id==='refl'){var p=prog(V.m);p.refl=t.value.slice(0,2000);persist();return}
  if(t.dataset.mc!==undefined&&E){var it0=E.media[t.dataset.mc][+t.dataset.mi];if(it0)it0.cap=t.value.slice(0,200);return}
  if(t.dataset.f&&E){E[t.dataset.f]=t.value;return}
  if(t.dataset.s!==undefined&&E){var s=E.soal[+t.dataset.s],k=t.dataset.key;if(k==='tipe')return;if(/^o\d$/.test(k))s.opsi[+k[1]]=t.value;else if(k==='kunci'){s.kunci=s.tipe==='pg'?+t.value:s.tipe==='bs'?t.value==='true':t.value}else s[k]=t.value}});
document.addEventListener('change',function(ev){var t=ev.target;if(t.dataset.up&&t.type==='file'){addFile(t);return}if(t.dataset.s!==undefined&&E&&t.dataset.key==='tipe'){var s=E.soal[+t.dataset.s];s.tipe=t.value;s.opsi=['','','',''];s.kunci=t.value==='pg'?0:t.value==='bs'?true:'';render()}else if(t.dataset.f==='viz'||t.dataset.f==='jenjang'){if(E)E[t.dataset.f]=t.value}});
window.addEventListener('online',function(){if(V.name==='beranda')render()});window.addEventListener('offline',function(){if(V.name==='beranda')render()});
render();
idbOpen().then(function(db){idb=db;return db?idbLoad():null}).then(function(){var f=SEED.files||{};Object.keys(f).forEach(function(k){if(!MEDIA[k])mput(k,f[k])});render()});
})();
